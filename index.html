<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>我的待辦清單</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換深色模式">
        <span id="theme-icon" class="theme-toggle-icon" aria-hidden="true">🌙</span>
        <span id="theme-label">深色模式</span>
      </button>
    </header>

    <!-- 新增待辦的表單 -->
    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">待辦事項內容</label>
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        placeholder="今天要做什麼？"
        maxlength="100"
      >
      <button type="submit" class="btn-add">新增</button>
    </form>

    <!-- 篩選按鈕用來切換目前顯示的待辦類型 -->
    <div id="filter-controls" class="filter-controls" aria-label="待辦篩選">
      <button type="button" class="filter-button active" data-filter="all">全部</button>
      <button type="button" class="filter-button" data-filter="active">未完成</button>
      <button type="button" class="filter-button" data-filter="completed">已完成</button>
    </div>

    <!-- 待辦清單內容由 JavaScript 動態產生 -->
    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <!-- 清單為空時顯示的提示 -->
    <p id="empty-state" class="empty-state" hidden>還沒有任何待辦事項,新增一個吧!</p>

    <footer class="app-footer">
      <span id="remaining-count">未完成:0 項</span>
      <button
        id="clear-completed-button"
        class="clear-completed-button"
        type="button"
        aria-label="清除所有已完成項目"
        disabled
      >
        清除已完成
      </button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
